---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: pip 
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:30"
      timezone: "Europe/London"
